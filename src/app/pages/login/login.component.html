<div class="wrapper">
  <mat-card class="card">
    <mat-card-header>
      <mat-card-title><mat-icon>checklist</mat-icon> TaskFlow</mat-card-title>
      <mat-card-subtitle>Connexion</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (error()) {
        <p class="error"><mat-icon>error</mat-icon> {{ error() }}</p>
      }

      <form (ngSubmit)="submit()" class="form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" required />
          <mat-icon matPrefix>mail</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Mot de passe</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required />
          <mat-icon matPrefix>lock</mat-icon>
        </mat-form-field>

        <button mat-flat-button type="submit">Se connecter</button>
      </form>
    </mat-card-content>

    <mat-card-footer class="footer">
      Pas de compte ? <a routerLink="/register">S'inscrire</a>
    </mat-card-footer>
  </mat-card>
</div>
